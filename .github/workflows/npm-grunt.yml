name: Publish Docker Image

on:
  push:
    branches: [ "main" ]
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      run: echo "${{secrets.DOCKER_TOKEN}}" | docker login -u "${{secrets.DOCKER_USERNAME}}" --password-stdin

    - name: Build Docker Image
      run: docker build . --file Dockerfile --tag ${{secrets.DOCKER_USERNAME}}/backend-boilerplate-code-cicd:latest

    - name: Push Docker Image
      run: docker push ${{secrets.DOCKER_USERNAME}}/backend-boilerplate-code-cicd:latest